events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml application/wasm;

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # Add MIME type mappings
        types {
            text/html                             html htm shtml;
            text/css                              css;
            application/javascript                js;
            application/json                      json;
            application/wasm                      wasm;
            image/png                             png;
            image/jpeg                            jpeg jpg;
            image/gif                             gif;
            image/svg+xml                         svg svgz;
            image/x-icon                          ico;
            font/woff                             woff;
            font/woff2                            woff2;
            application/font-woff                 woff;
            application/font-woff2                woff2;
            font/ttf                              ttf;
            font/otf                              otf;
        }

        # Blazor WebAssembly needs special handling for routing
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Ensure index.html is never cached
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        # Never cache service worker files
        location ~* ^/(service-worker\.js|sw-registrator\.js|service-worker-assets\.js)$ {
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
            add_header Pragma "no-cache";
            expires off;
        }

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|otf)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Special handling for framework files with proper MIME types
        location /_framework/ {
            # Ensure WASM files are served with correct MIME type
            if ($request_filename ~* \.wasm$) {
                add_header Content-Type application/wasm;
            }
            if ($request_filename ~* \.dll$) {
                add_header Content-Type application/octet-stream;
            }
            if ($request_filename ~* \.dat$) {
                add_header Content-Type application/octet-stream;
            }
            if ($request_filename ~* \.json$) {
                add_header Content-Type application/json;
            }
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
