version: '3.8'

services:

  api:
    build:
      context: .
      dockerfile: Api/Dockerfile.windows
      args:
        BASE_TAG: windowsservercore-ltsc2019
    container_name: bluchilli-api-windows
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_FORWARDEDHEADERS_ENABLED=true
      - Database__ConnectionString=mongodb+srv://bluchillworks:mmZBoRILdptwojfC@cluster0.6dfqp1l.mongodb.net/?retryWrites=true&w=majority&tls=true&tlsAllowInvalidCertificates=false
      - Database__DatabaseName=ttl
      - App__BaseUrl=${APP_BASE_URL:-http://web:80}
      - SecretKeys__ApiKey=${API_KEY:-9B000A31-59B3-465F-B642-1094E5C12078}
      - SecretKeys__ApiKeySecondary=${API_KEY_SECONDARY:-4D2C6F5B-45CB-45B6-B5BA-7DC77EB22934}
      - SecretKeys__UseSecondaryKey=true
      - Email__FromEmail=${EMAIL_FROM:-noreply@bluchilliworks.com}
      - Email__FromName=BluChilli Works
      - Email__Smtp__Host=${SMTP_HOST:-smtp.ethereal.email}
      - Email__Smtp__Port=${SMTP_PORT:-587}
      - Email__Smtp__Username=${SMTP_USERNAME:-hertha.luettgen92@ethereal.email}
      - Email__Smtp__Password=${SMTP_PASSWORD:-vkxbECCP819UyWugEm}
      - Email__Smtp__EnableSsl=true
    ports:
      - "5000:8080"
    networks:
      - bluchilli-network
    healthcheck:
      test: ["CMD", "powershell", "Invoke-WebRequest -UseBasicParsing -Uri http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  web:
    build:
      context: .
      dockerfile: WebServer/Dockerfile.windows
      args:
        BASE_TAG: windowsservercore-ltsc2019
    container_name: bluchilli-webserver
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Logging__LogLevel__Default=Information
      - Logging__LogLevel__Microsoft.AspNetCore=Warning
      - DetailedErrors=true
      - SignalRHubUrl=${SIGNALR_HUB_URL:-http://web:80/applicationHub}
      - BaseApiServiceUrl=${BASE_API_SERVICE_URL:-http://api:8080}
      - BaseWebUrl=${BASE_WEB_URL:-http://web:80}
      - AllowedHosts=*
      - AuthorizationKey=4D2C6F5B-45CB-45B6-B5BA-7DC77EB22934
      - ApplicationName=BluChilliWorks Web Server
    ports:
      - "5001:80"
    # depends_on:
    #   api:
    #     condition: service_healthy
    networks:
      - bluchilli-network


networks:
  bluchilli-network:
    driver: nat
